name: Publish to PyPI

# Publishes viva-smoldyn to PyPI via OIDC Trusted Publishing (no API token).
# Triggered when a GitHub Release is published, so cutting a Release is the
# single action that ships a version.
#
# PREREQUISITE (one-time, human PyPI owner only — an agent cannot do this):
#   viva-smoldyn is not yet on PyPI, so add a PENDING publisher at
#   https://pypi.org/manage/account/publishing/ -> GitHub, with:
#     PyPI Project Name:   viva-smoldyn
#     owner:               vivarium-collective
#     repository:          viva-smoldyn
#     workflow filename:   release.yml
#     environment name:    pypi
#   Until that is configured PyPI-side, the publish step below fails.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # The dedicated environment the PyPI Trusted Publisher is scoped to.
    environment:
      name: pypi
      url: https://pypi.org/project/viva-smoldyn/
    permissions:
      # OIDC token for Trusted Publishing — this is what replaces an API token.
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to a released tag. No `password:` — auth is OIDC.
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Idempotent re-runs: skip any file already on PyPI.
          skip-existing: true
