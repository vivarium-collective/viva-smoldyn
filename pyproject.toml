[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-smoldyn"
version = "0.1.2"
description = "Process-bigraph wrapper for Smoldyn spatial stochastic simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "viva-emitters>=0.4.2",
    "viva-superpowers",
    "viva-simularium",
    "smoldyn",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
viva-simularium = { git = "https://github.com/vivarium-collective/viva-simularium.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_smoldyn*"]
