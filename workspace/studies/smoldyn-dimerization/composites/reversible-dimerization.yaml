name: reversible-dimerization
description: "Smoldyn 3D reversible dimerization: fast red monomers A diffuse and bind pairwise into slower blue dimers B (A + A <-> B) in a reflecting cubic box. Emits per-species counts, per-molecule positions, and time each step — the positions drive a Simularium trajectory."
tags: [particles, reaction-diffusion, 3d, simularium]

requires:
  processes: [SmoldynProcess, RAMEmitter]

# Concrete inline values (no ${} templating) so the composite runs directly
# through the workbench study runner, not only viva_smoldyn.build_composite.

state:
  smoldyn:
    _type: process
    address: "local:SmoldynProcess"
    config:
      dimensions: 3
      bounds:
        - [0, 50]
        - [0, 50]
        - [0, 50]
      boundary_type: r
      dt: 0.01
      seed: 12345
      species:
        A:
          difc: 3.0
          count: 250
          color: red
          display_size: 1.2
        B:
          difc: 1.0
          count: 0
          color: blue
          display_size: 2.0
      reactions:
        - name: dimerize
          subs: [A, A]
          prds: [B]
          rate: 2.0
          kb: 0.15
    inputs: {}
    outputs:
      molecule_counts: ["stores", "molecule_counts"]
      molecule_positions: ["stores", "molecule_positions"]
      time: ["stores", "time"]
    interval: 0.5
  stores:
    molecule_counts: {}
    molecule_positions: []
    time: 0.0
